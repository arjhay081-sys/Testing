<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Bobby's Admin · BMR</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="BMR.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:    #0a0f1e;
      --navy2:   #0f1629;
      --navy3:   #141c35;
      --navy4:   #1a2440;
      --gold:    #f4c430;
      --gold2:   #ffd700;
      --gold-d:  rgba(244,196,48,.12);
      --gold-b:  rgba(244,196,48,.28);
      --blue:    #1e6ef5;
      --blue2:   #3b82f6;
      --blue-d:  rgba(30,110,245,.12);
      --blue-b:  rgba(30,110,245,.3);
      --green:   #22c55e;
      --red:     #ef4444;
      --orange:  #f97316;
      --purple:  #8b5cf6;
      --teal:    #14b8a6;
      --border:  rgba(255,255,255,.07);
      --muted:   #64748b;
      --txt:     #e2e8f0;
      --sub:     #94a3b8;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      font-family:'Plus Jakarta Sans', sans-serif;
      background: var(--navy);
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes spin    { to { transform:rotate(360deg); } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
    @keyframes pulse   { 0%,100%{opacity:1;} 50%{opacity:.35;} }
    @keyframes shimmer { 0%{background-position:-200% center;} 100%{background-position:200% center;} }
    @keyframes bellRing {
      0%,100%{transform:rotate(0)} 15%{transform:rotate(-18deg)} 30%{transform:rotate(18deg)}
      45%{transform:rotate(-10deg)} 60%{transform:rotate(10deg)} 75%{transform:rotate(0)}
    }
    @keyframes orbPulse { 0%,100%{transform:scale(1);opacity:.07;} 50%{transform:scale(1.15);opacity:.12;} }
    @keyframes slideIn { from{opacity:0;transform:translateX(-12px);} to{opacity:1;transform:none;} }

    /* ── SCREEN MANAGEMENT ── */
    .screen { display:none; }
    .screen.active { display:block; }

    /* ── LOGIN PAGE ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
    }
    .lg-bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: radial-gradient(ellipse at 20% 50%, rgba(30,110,245,.09) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(244,196,48,.06) 0%, transparent 55%),
                  var(--navy);
    }
    .lg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(30,110,245,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,110,245,.04) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }
    .lg-orb1 {
      position:absolute; width:500px; height:500px; border-radius:50%;
      background:radial-gradient(circle, rgba(30,110,245,.15) 0%, transparent 65%);
      top:-150px; left:-100px;
      animation: orbPulse 8s ease-in-out infinite;
    }
    .lg-orb2 {
      position:absolute; width:400px; height:400px; border-radius:50%;
      background:radial-gradient(circle, rgba(244,196,48,.1) 0%, transparent 65%);
      bottom:-100px; right:-80px;
      animation: orbPulse 10s ease-in-out infinite reverse;
    }
    .lg-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      animation: fadeUp .5s ease both;
    }
    .lg-brand {
      text-align: center; margin-bottom: 2rem;
    }
    .lg-logo-ring {
      width: 76px; height: 76px; border-radius: 20px;
      border: 1px solid var(--gold-b);
      background: linear-gradient(135deg, rgba(30,110,245,.15), rgba(244,196,48,.08));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      position: relative;
    }
    .lg-logo-ring::before {
      content:''; position:absolute; inset:-1px; border-radius:20px;
      background: linear-gradient(135deg, var(--gold), var(--blue), transparent);
      z-index:-1; opacity:.3;
    }
    .lg-logo-ring img { width:48px; height:48px; border-radius:10px; object-fit:contain; }
    .lg-brand h1 {
      font-size: 1.6rem; font-weight: 900; letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 60%, var(--gold2) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s linear infinite;
    }
    .lg-brand p {
      color: var(--muted); font-size: .78rem; margin-top: .3rem;
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .lg-card {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 2rem;
      backdrop-filter: blur(20px);
      position: relative; overflow: hidden;
    }
    .lg-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, var(--gold-b), rgba(30,110,245,.4), transparent);
    }
    .lg-card::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, var(--blue-b), transparent);
    }
    .field-label {
      display:block; font-size:.7rem; font-weight:700;
      text-transform:uppercase; letter-spacing:1.2px;
      color: var(--sub); margin-bottom:.5rem; margin-top:1.25rem;
    }
    .field-label:first-of-type { margin-top:0; }
    .field-input {
      width:100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: .85rem 1rem;
      color: var(--txt); font-size: .95rem;
      font-family: inherit; outline: none;
      transition: all .2s;
    }
    .field-input:focus {
      border-color: var(--blue-b);
      background: var(--blue-d);
      box-shadow: 0 0 0 3px rgba(30,110,245,.1);
    }
    .field-input::placeholder { color: #2d3a52; }
    .err-box {
      background: rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
      border-radius: 10px; padding: .7rem 1rem;
      color: var(--red); font-size: .8rem; margin-top:1rem; display:none;
    }
    .err-box.show { display:block; }
    .btn-login {
      width:100%; margin-top:1.5rem;
      background: linear-gradient(135deg, var(--blue) 0%, #2563eb 50%, #1d4ed8 100%);
      color:#fff; border:none; padding:1rem;
      border-radius:13px; font-weight:800; font-size:1rem;
      font-family:inherit; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:.5rem;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(30,110,245,.3);
      position:relative; overflow:hidden;
    }
    .btn-login::before {
      content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
      transition: left .4s;
    }
    .btn-login:hover::before { left:100%; }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(30,110,245,.45); }
    .btn-login:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .lg-spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none; }
    .lg-note { text-align:center; margin-top:1.5rem; color:#2d3a52; font-size:.72rem; }

    /* Gold accent line on top */
    .lg-gold-bar {
      width:48px; height:3px; border-radius:2px;
      background: linear-gradient(90deg, var(--blue), var(--gold));
      margin: 0 auto 1.25rem;
    }

    /* ── ADMIN DASHBOARD ── */
    #admin-screen { display:none; min-height:100vh; }
    #admin-screen.active { display:block; }

    /* TOPBAR */
    .topbar {
      background: rgba(10,15,30,.95);
      border-bottom: 1px solid var(--border);
      padding: .75rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200;
      backdrop-filter: blur(24px);
    }
    .topbar::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, var(--blue-b), var(--gold-b), var(--blue-b));
    }
    .tb-left { display:flex; align-items:center; gap:.75rem; }
    .tb-logo {
      width:36px; height:36px; border-radius:10px;
      border:1px solid var(--gold-b);
      background: rgba(244,196,48,.06);
      display:flex; align-items:center; justify-content:center;
    }
    .tb-logo img { width:26px; height:26px; border-radius:6px; object-fit:contain; }
    .tb-title { font-size:.9rem; font-weight:800; letter-spacing:-.01em; }
    .tb-title em { font-style:normal; color:var(--gold); }
    .tb-right { display:flex; align-items:center; gap:.5rem; }
    .live-pill {
      display:flex; align-items:center; gap:.35rem;
      background: rgba(34,197,94,.08);
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 20px; padding: .25rem .65rem;
    }
    .live-dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:pulse 2s infinite; }
    .live-lbl { color:var(--green); font-size:.65rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; }
    .icon-btn {
      background:transparent; border:1px solid var(--border);
      color:var(--muted); width:34px; height:34px; border-radius:9px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all .2s; flex-shrink:0;
    }
    .icon-btn:hover, .icon-btn.on { border-color:var(--gold-b); color:var(--gold); background:var(--gold-d); }
    .icon-btn svg { width:16px; height:16px; fill:currentColor; }
    .icon-btn.ring svg { animation:bellRing .6s ease; }
    .btn-logout {
      background: rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2);
      color:var(--red); padding:.4rem .85rem; border-radius:9px;
      font-size:.77rem; font-weight:700; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; gap:.35rem;
      transition:all .2s;
    }
    .btn-logout:hover { background:rgba(239,68,68,.18); }
    .btn-logout svg { width:14px; height:14px; fill:var(--red); }

    /* MAIN */
    .main { max-width:1120px; margin:0 auto; padding:1.5rem; }

    /* SECTION HEADER */
    .section-hdr {
      display:flex; align-items:center; gap:.65rem; margin-bottom:1.25rem;
    }
    .section-hdr-line {
      width:3px; height:18px; border-radius:2px;
      background: linear-gradient(180deg, var(--blue), var(--gold));
    }
    .section-hdr h2 { font-size:.88rem; font-weight:800; color:var(--sub); text-transform:uppercase; letter-spacing:1.5px; }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.5rem; }
    .stat-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem 1.2rem;
      display: flex; align-items: center; gap:.9rem;
      animation: fadeUp .35s ease both;
      position:relative; overflow:hidden;
      transition: border-color .2s;
    }
    .stat-card:hover { border-color: rgba(30,110,245,.3); }
    .stat-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(30,110,245,.3), transparent);
    }
    .stat-ico {
      width:40px; height:40px; border-radius:11px;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .stat-ico svg { width:18px; height:18px; }
    .stat-val { font-size:1.9rem; font-weight:900; line-height:1; letter-spacing:-.03em; }
    .stat-lbl { color:var(--muted); font-size:.65rem; text-transform:uppercase; letter-spacing:1.2px; margin-top:3px; font-weight:600; }

    /* CONTROLS */
    .controls { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:.85rem; align-items:center; }
    .filter-btn {
      background: var(--navy2); border:1px solid var(--border);
      color:var(--muted); padding:.4rem .9rem; border-radius:20px;
      font-size:.75rem; font-weight:700; font-family:inherit;
      cursor:pointer; transition:all .2s;
      display:flex; align-items:center; gap:.35rem;
    }
    .filter-btn.active { background:var(--blue-d); border-color:var(--blue-b); color:var(--blue2); }
    .filter-btn .cnt {
      background:rgba(255,255,255,.06); padding:1px 7px;
      border-radius:8px; font-size:.65rem;
    }
    .filter-btn.active .cnt { background:rgba(59,130,246,.15); }
    .vdiv { width:1px; height:22px; background:var(--border); }

    /* SORT */
    .sort-row { display:flex; align-items:center; gap:.5rem; margin-bottom:1.1rem; flex-wrap:wrap; }
    .sort-lbl { color:var(--muted); font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; }
    .sort-btn {
      background:var(--navy2); border:1px solid var(--border);
      color:var(--muted); padding:.38rem .85rem; border-radius:8px;
      font-size:.75rem; font-weight:700; font-family:inherit;
      cursor:pointer; transition:all .2s;
      display:flex; align-items:center; gap:.35rem;
    }
    .sort-btn.active { background:var(--gold-d); border-color:var(--gold-b); color:var(--gold); }
    .sort-btn svg { width:12px; height:12px; fill:currentColor; }

    /* BOOKING CARDS */
    .list { display:grid; gap:1rem; }
    .bcard {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
      border-radius: 16px; overflow:hidden;
      animation: fadeUp .3s ease both;
      transition: border-color .2s;
    }
    .bcard:hover { border-color: rgba(30,110,245,.3); border-left-color:var(--gold); }
    .bcard.tour { border-left-color: var(--teal); }
    .bcard.approved { border-left-color: var(--green); }
    .bcard.rejected { border-left-color: var(--red); }

    .bcard-top {
      padding: .85rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      gap:.5rem; flex-wrap:wrap;
      background: rgba(255,255,255,.015);
    }
    .bcard-tl { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
    .badge-type {
      font-size:.6rem; font-weight:800; text-transform:uppercase;
      letter-spacing:1.2px; padding:2px 8px; border-radius:6px;
    }
    .badge-type.bike { background:var(--gold-d); color:var(--gold); border:1px solid var(--gold-b); }
    .badge-type.tour { background:rgba(20,184,166,.1); color:var(--teal); border:1px solid rgba(20,184,166,.3); }
    .bid { font-size:.9rem; font-weight:800; letter-spacing:.01em; }
    .badge-status {
      font-size:.6rem; font-weight:800; text-transform:uppercase;
      letter-spacing:1px; padding:2px 9px; border-radius:20px;
    }
    .badge-status.pending  { background:rgba(249,115,22,.1);  color:var(--orange); border:1px solid rgba(249,115,22,.3); }
    .badge-status.approved { background:rgba(34,197,94,.1);   color:var(--green);  border:1px solid rgba(34,197,94,.3); }
    .badge-status.rejected { background:rgba(239,68,68,.1);   color:var(--red);    border:1px solid rgba(239,68,68,.3); }
    .bcard-tr { display:flex; align-items:center; gap:.6rem; }
    .card-time { color:var(--muted); font-size:.68rem; white-space:nowrap; }
    .btn-expand {
      background:transparent; border:none; color:var(--muted);
      font-size:.73rem; font-weight:700; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; gap:.25rem;
      padding:.2rem 0; transition:color .2s;
    }
    .btn-expand:hover { color:var(--blue2); }
    .btn-expand svg { width:13px; height:13px; fill:currentColor; transition:transform .25s; }
    .btn-expand.open svg { transform:rotate(180deg); }

    .bcard-body {
      padding: .9rem 1.2rem;
      display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem;
    }
    .cf label {
      display:block; color:var(--muted); font-size:.6rem;
      text-transform:uppercase; letter-spacing:1.2px; margin-bottom:3px; font-weight:600;
    }
    .cf span { color:var(--txt); font-size:.83rem; font-weight:600; }
    .cf span.gold { color:var(--gold); }
    .cf span.teal { color:var(--teal); }

    .extra { max-height:0; overflow:hidden; transition:max-height .4s ease; }
    .extra.open { max-height:600px; }
    .extra-inner {
      padding:.9rem 1.2rem; border-top:1px solid var(--border);
      display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem;
    }

    /* ACTIONS */
    .bcard-actions {
      padding:.8rem 1.2rem; border-top:1px solid var(--border);
      display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
      background: rgba(255,255,255,.01);
    }
    .btn-approve {
      background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3);
      color:var(--green); padding:.5rem 1rem; border-radius:9px;
      font-weight:700; font-size:.78rem; font-family:inherit;
      cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:.35rem;
    }
    .btn-approve:hover { background:rgba(34,197,94,.2); }
    .btn-reject {
      background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
      color:var(--red); padding:.5rem 1rem; border-radius:9px;
      font-weight:700; font-size:.78rem; font-family:inherit;
      cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:.35rem;
    }
    .btn-reject:hover { background:rgba(239,68,68,.2); }
    .btn-dl {
      background:var(--blue-d); border:1px solid var(--blue-b);
      color:var(--blue2); padding:.5rem 1rem; border-radius:9px;
      font-weight:700; font-size:.78rem; font-family:inherit;
      cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:.35rem;
      margin-left:auto;
    }
    .btn-dl:hover { background:rgba(30,110,245,.2); }
    .btn-del {
      background:transparent; border:1px solid rgba(239,68,68,.12);
      color:#3a4a5a; padding:.5rem .65rem; border-radius:9px;
      font-size:.78rem; font-family:inherit; cursor:pointer; transition:all .2s;
      display:flex; align-items:center;
    }
    .btn-del:hover { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.35); color:var(--red); }
    .btn-approve svg,.btn-reject svg,.btn-dl svg,.btn-del svg { width:14px; height:14px; fill:currentColor; }
    .note-text { color:var(--muted); font-size:.74rem; font-style:italic; }
    .btn-paid {
      background:linear-gradient(135deg, var(--teal), #0f9a8a);
      color:#fff; border:none; padding:.5rem 1rem; border-radius:9px;
      font-weight:700; font-size:.78rem; font-family:inherit;
      cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:.35rem;
    }
    .btn-paid:hover { opacity:.85; transform:translateY(-1px); }
    .btn-paid svg { width:14px; height:14px; fill:#fff; }
    .paid-badge {
      background:rgba(20,184,166,.12); border:1px solid rgba(20,184,166,.35);
      color:var(--teal); padding:.45rem .9rem; border-radius:9px;
      font-size:.73rem; font-weight:700; display:inline-flex; align-items:center; gap:.4rem;
    }
    .paid-badge svg { width:13px; height:13px; fill:var(--teal); }
    .rental-badge {
      padding:.45rem .9rem; border-radius:9px; font-size:.73rem; font-weight:700;
      display:inline-flex; align-items:center; gap:.4rem;
      background:rgba(139,92,246,.12); border:1px solid rgba(139,92,246,.35); color:var(--purple);
    }
    .rental-badge.over { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.35); color:var(--red); }
    .rental-badge svg { width:13px; height:13px; fill:currentColor; }

    /* STATES */
    .state-box { text-align:center; padding:4rem 1.5rem; color:var(--muted); }
    .state-box svg { width:44px; height:44px; fill:currentColor; opacity:.25; display:block; margin:0 auto 1rem; }
    .state-box h3 { font-size:1rem; margin-bottom:.4rem; color:#4a5568; }
    .spinner-wrap { text-align:center; padding:4rem; }
    .spinner {
      width:32px; height:32px;
      border:3px solid rgba(30,110,245,.12);
      border-top-color:var(--blue);
      border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 1rem;
    }

    /* MODAL */
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.8);
      backdrop-filter:blur(10px); display:none;
      align-items:center; justify-content:center;
      z-index:300; padding:1rem;
    }
    .overlay.show { display:flex; }
    .modal {
      background: var(--navy2);
      border:1px solid var(--border);
      border-radius:20px; padding:1.75rem;
      max-width:440px; width:100%;
      position:relative; animation:fadeUp .25s ease;
    }
    .modal::before {
      content:''; position:absolute; top:0; left:0; right:0;
      height:1px; border-radius:20px 20px 0 0;
    }
    .modal.approve::before { background:linear-gradient(90deg,transparent,var(--green),transparent); }
    .modal.reject::before  { background:linear-gradient(90deg,transparent,var(--red),transparent); }
    .modal h3 { font-size:1.1rem; font-weight:800; margin-bottom:.35rem; }
    .modal h3.g { color:var(--green); } .modal h3.r { color:var(--red); }
    .modal p { color:var(--muted); font-size:.82rem; margin-bottom:1.1rem; }
    .modal textarea {
      width:100%; background:rgba(255,255,255,.04);
      border:1px solid var(--border); border-radius:11px;
      padding:.8rem; color:var(--txt); font-size:.85rem;
      resize:vertical; min-height:80px; outline:none;
      font-family:inherit; transition:border-color .2s;
    }
    .modal textarea:focus { border-color:var(--blue-b); }
    .modal textarea::placeholder { color:#2d3a52; }
    .modal-btns { display:flex; gap:.65rem; margin-top:1.1rem; }
    .btn-cancel {
      background:transparent; border:1px solid var(--border);
      color:var(--muted); padding:.8rem 1.1rem; border-radius:10px;
      cursor:pointer; font-size:.88rem; font-family:inherit; transition:all .2s;
    }
    .btn-cancel:hover { border-color:rgba(255,255,255,.2); color:var(--txt); }
    .btn-go-approve {
      flex:1; background:linear-gradient(135deg, var(--green), #16a34a);
      color:#fff; border:none; padding:.8rem; border-radius:10px;
      font-weight:800; font-family:inherit; cursor:pointer; font-size:.92rem;
      transition:opacity .2s;
    }
    .btn-go-reject {
      flex:1; background:linear-gradient(135deg, var(--red), #dc2626);
      color:#fff; border:none; padding:.8rem; border-radius:10px;
      font-weight:800; font-family:inherit; cursor:pointer; font-size:.92rem;
      transition:opacity .2s;
    }
    .btn-go-approve:hover,.btn-go-reject:hover { opacity:.88; }
    .btn-go-approve:disabled,.btn-go-reject:disabled { opacity:.5; cursor:not-allowed; }

    /* RECEIPT */
    #rc-wrap { position:fixed; left:-9999px; top:0; width:680px; z-index:-1; font-family:'Plus Jakarta Sans',sans-serif; }

    /* RESPONSIVE */
    @media(max-width:700px) {
      .stats-grid { grid-template-columns:1fr 1fr; }
      .bcard-body,.extra-inner { grid-template-columns:1fr 1fr; }
      .main { padding:1rem; }
      .tb-title { display:none; }
      .topbar { padding:.75rem 1rem; }
    }
    @media(max-width:400px) {
      .stats-grid { grid-template-columns:1fr 1fr; }
      .bcard-body { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
'use strict';

// ── FIREBASE ─────────────────────────────────────────────────────────
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:            'AIzaSyCG1hOzMXJDQCcj-_OlmYBu9mV8xdN15bI',
    authDomain:        'bobbys-motorbike-rental.firebaseapp.com',
    projectId:         'bobbys-motorbike-rental',
    storageBucket:     'bobbys-motorbike-rental.firebasestorage.app',
    messagingSenderId: '22999361272',
    appId:             '1:22999361272:web:3f2abf58faf2e8f8e3fd0d'
  });
}
var auth = firebase.auth();
var db   = firebase.firestore();

// ── SCREEN MANAGEMENT ─────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── AUTH ──────────────────────────────────────────────────────────────
auth.onAuthStateChanged(function(user) {
  if (user) { showScreen('admin-screen'); loadData(); }
  else       { showScreen('login-screen'); }
});

// LOGIN
document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown',    function(e){ if(e.key==='Enter') doLogin(); });

function doLogin() {
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var errEl    = document.getElementById('err-box');
  var btn      = document.getElementById('login-btn');
  var spin     = document.getElementById('lg-spin');
  var btnTxt   = document.getElementById('btn-txt');
  errEl.classList.remove('show');
  if (!email || !password) { errEl.textContent='Please enter your email and password.'; errEl.classList.add('show'); return; }
  btn.disabled=true; spin.style.display='block'; btnTxt.textContent='Signing in…';
  auth.signInWithEmailAndPassword(email, password)
    .catch(function(err) {
      btn.disabled=false; spin.style.display='none'; btnTxt.textContent='Sign In';
      var msg = 'Incorrect email or password.';
      if (err.code==='auth/too-many-requests')     msg='Too many attempts. Please try again later.';
      if (err.code==='auth/network-request-failed') msg='Network error. Check your connection.';
      errEl.textContent=msg; errEl.classList.add('show');
    });
}

function doLogout() {
  auth.signOut().then(function() { showScreen('login-screen'); });
}

// ── STATE ─────────────────────────────────────────────────────────────
var allDocs   = [], curFilter='all', curSort='submitted', sortAsc=false;
var notifOn   = false, prevIds=null, pendingAct=null;
var _unsubBike=null, _unsubTour=null;

// ── LOAD DATA ─────────────────────────────────────────────────────────
function loadData() {
  setList(spinner('Connecting to database…'));
  if (_unsubBike) { _unsubBike(); _unsubBike=null; }
  if (_unsubTour) { _unsubTour(); _unsubTour=null; }
  Promise.all([
    db.collection('bookings').get(),
    db.collection('tour_bookings').get()
  ]).then(function(res) {
    var bikes = res[0].docs.map(function(d){ return Object.assign({}, d.data(), {_id:d.id, _type:'bike'}); });
    var tours = res[1].docs.map(function(d){ return Object.assign({}, d.data(), {_id:d.id, _type:'tour'}); });
    allDocs = bikes.concat(tours);
    checkNew(); render();
    _unsubBike = db.collection('bookings').onSnapshot(function(snap) {
      var t = allDocs.filter(function(d){ return d._type==='tour'; });
      allDocs = snap.docs.map(function(d){ return Object.assign({},d.data(),{_id:d.id,_type:'bike'}); }).concat(t);
      checkNew(); render();
    }, function(){});
    _unsubTour = db.collection('tour_bookings').onSnapshot(function(snap) {
      var b = allDocs.filter(function(d){ return d._type==='bike'; });
      allDocs = b.concat(snap.docs.map(function(d){ return Object.assign({},d.data(),{_id:d.id,_type:'tour'}); }));
      checkNew(); render();
    }, function(){});
  }).catch(showError);
}

// ── RENDER ────────────────────────────────────────────────────────────
function render() {
  updateStats();
  var docs = getFiltered();
  if (!docs.length) {
    setList('<div class="state-box"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><h3>No bookings found</h3><p>New bookings appear here in real time</p></div>');
    return;
  }
  setList(docs.map(buildCard).join(''));
}

function updateStats() {
  var tot=allDocs.length, pen=0, app=0, rej=0, bk=0, tr=0;
  allDocs.forEach(function(d){
    if(d.status==='pending')  pen++;
    if(d.status==='approved') app++;
    if(d.status==='rejected') rej++;
    if(d._type==='bike') bk++;
    if(d._type==='tour') tr++;
  });
  document.getElementById('s-total').textContent    = tot;
  document.getElementById('s-pending').textContent  = pen;
  document.getElementById('s-approved').textContent = app;
  document.getElementById('s-rejected').textContent = rej;
  document.getElementById('fc-all').textContent     = tot;
  document.getElementById('fc-pending').textContent = pen;
  document.getElementById('fc-approved').textContent= app;
  document.getElementById('fc-rejected').textContent= rej;
  document.getElementById('fc-bike').textContent    = bk;
  document.getElementById('fc-tour').textContent    = tr;
}

function getFiltered() {
  var list = allDocs.filter(function(d) {
    if(curFilter==='bike')     return d._type==='bike';
    if(curFilter==='tour')     return d._type==='tour';
    if(curFilter==='pending')  return d.status==='pending';
    if(curFilter==='approved') return d.status==='approved';
    if(curFilter==='rejected') return d.status==='rejected';
    return true;
  });
  list.sort(function(a,b){
    var av,bv;
    if(curSort==='date'){
      av=new Date(a.startDate||a.tourDate||a.formattedDate||0).getTime();
      bv=new Date(b.startDate||b.tourDate||b.formattedDate||0).getTime();
    } else {
      av=a.createdAt?a.createdAt.toMillis():0;
      bv=b.createdAt?b.createdAt.toMillis():0;
    }
    return sortAsc?av-bv:bv-av;
  });
  return list;
}

// ── BUILD CARD ────────────────────────────────────────────────────────
function buildCard(d) {
  var isBike = d._type==='bike';
  var st     = d.status||'pending';
  var stLbl  = st.charAt(0).toUpperCase()+st.slice(1);

  var main = isBike ? [
    cf('Customer', d.name),
    cf('Bike',     '<span class="gold">'+esc(d.bikeName)+'</span>'),
    cf('Date',     esc(d.formattedDate||'–')),
    cf('Duration', esc(d.rentalDays)+'d · '+esc(d.numBikes)+' bike(s)'),
    cf('Total',    '<span class="gold">₱'+num(d.totalPrice)+'</span>'),
    cf('Contact',  esc(d.phone))
  ] : [
    cf('Customer',   d.name),
    cf('Date',       '<span class="teal">'+esc(d.formattedDate||'–')+'</span>'),
    cf('Start Time', esc(d.startTime||'–')),
    cf('Duration',   '8 Hours'),
    cf('Contact',    esc(d.phone)),
    cf('Requests',   esc(d.stops||'None'))
  ];

  var extra = isBike ? [
    cf('Gender',        d.gender),
    cf('Nationality',   d.nationality),
    cf('Age',           d.age),
    cf('Accommodation', d.location),
    cf('Helmets',       d.helmets),
    cf('Deposit',       '₱'+num(d.depositAmount||d.bikePrice))
  ] : [
    cf('Gender',        d.gender),
    cf('Nationality',   d.nationality),
    cf('Age',           d.age),
    cf('Accommodation', d.location),
    cf('Duration',      '8 Hours'),
    cf('Special Req.',  d.stops||'None')
  ];

  var actions='';
  if(st==='pending'){
    actions =
      '<button class="btn-approve" onclick="openModal(\''+d._id+'\',\''+d._type+'\',\'approve\')">'+
      '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>Approve</button>'+
      '<button class="btn-reject" onclick="openModal(\''+d._id+'\',\''+d._type+'\',\'reject\')">'+
      '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>Reject</button>'+
      delBtn(d._id, d._type);
  } else {
    var note    = d.adminNotes?'<span class="note-text">"'+esc(d.adminNotes)+'"</span>':'';
    var paidUI  = '', rentalUI='';
    if(st==='approved'){
      paidUI = d.paid
        ?'<span class="paid-badge"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>Paid</span>'
        :'<button class="btn-paid" onclick="markPaid(\''+d._id+'\',\''+d._type+'\')"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>Mark as Paid</button>';
      if(d.paid && isBike && d.startDate && d.startTime && d.rentalDays){
        var rs=rentalStatus(d.startDate,d.startTime,d.rentalDays);

function cf(label,val){ return '<div class="cf"><label>'+label+'</label><span>'+(val||'–')+'</span></div>'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(n){ return Number(n||0).toLocaleString(); }
function setList(html){ document.getElementById('list').innerHTML=html; }
function spinner(msg){ return '<div class="spinner-wrap"><div class="spinner"></div><div style="color:var(--muted);font-size:.85rem;">'+msg+'</div></div>'; }
function delBtn(id,type){ return '<button class="btn-del" onclick="delBooking(\''+id+'\',\''+type+'\')" title="Delete"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>'; }
function timeAgo(ts){
  if(!ts||!ts.toMillis) return '–';
  var m=Math.floor((Date.now()-ts.toMillis())/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+'m ago';
  var h=Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function rentalStatus(startDate,startTime,days){
  try{
    var p=startDate.split('-'),tp=startTime.split(':');
    var start=new Date(+p[0],+p[1]-1,+p[2],+tp[0],+tp[1]).getTime();
    var diff=(start+(+days*86400000))-Date.now();
    var over=diff<=0; var ms=Math.abs(diff);
    var mins=Math.floor(ms/60000),hrs=Math.floor(mins/60),d=Math.floor(hrs/24);
    var text=mins<60?(over?'Over ':'Ends in ')+mins+' min'+(mins!==1?'s':'')
            :hrs<24 ?(over?'Over ':'Ends in ')+hrs+' hr' +(hrs !==1?'s':'')
            :        (over?'Over ':'Ends in ')+d   +' day'+(d   !==1?'s':'')+(over?' ago':'');
    return{text:text,over:over};
  }catch(e){return{text:'Status unknown',over:false};}
}

// ── MODAL ─────────────────────────────────────────────────────────────
function openModal(id,type,action){
  pendingAct={id:id,type:type,action:action};
  var doc=allDocs.find(function(d){return d._id===id;});
  var name=doc?doc.name:'this customer';
  var box=document.getElementById('modal-box');
  var notes=document.getElementById('modal-notes');
  var go=document.getElementById('modal-go');
  notes.value='';
  if(action==='approve'){
    box.className='modal approve';
    document.getElementById('modal-title').className='g';
    document.getElementById('modal-title').textContent='Approve Booking';
    document.getElementById('modal-desc').textContent='Confirm booking for '+name+'. Add an optional message.';
    notes.placeholder='e.g. See you on the day! Please bring your ID.';
    go.className='btn-go-approve'; go.textContent='✓ Confirm Approval';
  } else {
    box.className='modal reject';
    document.getElementById('modal-title').className='r';
    document.getElementById('modal-title').textContent='Reject Booking';
    document.getElementById('modal-desc').textContent='Reject booking for '+name+'. Please give a reason.';
    notes.placeholder='e.g. Sorry, the bike is not available on that date.';
    go.className='btn-go-reject'; go.textContent='✕ Confirm Rejection';
  }
  go.onclick=confirmAction;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); pendingAct=null; }
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function confirmAction(){
  if(!pendingAct) return;
  var go=document.getElementById('modal-go');
  var col=pendingAct.type==='bike'?'bookings':'tour_bookings';
  var status=pendingAct.action==='approve'?'approved':'rejected';
  var notes=document.getElementById('modal-notes').value.trim();
  go.disabled=true; go.textContent='Saving…';
  db.collection(col).doc(pendingAct.id).update({
    status:status, adminNotes:notes,
    processedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){closeModal();})
    .catch(function(e){go.disabled=false;go.textContent='Try Again';console.error(e);});
}

// ── DELETE & MARK PAID ────────────────────────────────────────────────
function delBooking(id,type){
  if(!confirm('Delete this booking? This cannot be undone.')) return;
  db.collection(type==='bike'?'bookings':'tour_bookings').doc(id).delete()
    .catch(function(e){alert('Delete failed: '+e.message);});
}
function markPaid(id,type){
  if(!confirm('Mark this booking as paid?')) return;
  db.collection(type==='bike'?'bookings':'tour_bookings').doc(id).update({
    paid:true, paidAt:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(function(e){alert('Error: '+e.message);});
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────
function checkNew(){
  var ids=allDocs.map(function(d){return d._id;}).sort().join(',');
  if(prevIds===null){prevIds=ids;return;}
  if(ids!==prevIds&&notifOn){
    var old=prevIds.split(',');
    if(allDocs.some(function(d){return!old.includes(d._id);})) pingSound();
  }
  prevIds=ids;
}
function toggleNotif(){
  notifOn=!notifOn;
  var btn=document.getElementById('bell-btn');
  btn.classList.toggle('on',notifOn);
  btn.title=notifOn?'Notifications ON':'Notifications OFF';
  if(notifOn) pingSound();
}
function pingSound(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach(function(freq,i){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=freq;
      var t=ctx.currentTime+i*0.13;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.18,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.38);
      o.start(t);o.stop(t+0.4);
    });
    var bell=document.getElementById('bell-btn');
    bell.classList.add('ring');
    setTimeout(function(){bell.classList.remove('ring');},700);
  }catch(e){}
}

// ── ERROR ─────────────────────────────────────────────────────────────
function showError(err){
  var code=err?(err.code||')':'';
  var msg=code==='permission-denied'?'Permission denied — check your Firestore Security Rules.'
         :code==='timeout'          ?'Database took too long to respond.'
         :                           'Could not connect to database. ('+(code||'unknown')+')';
  setList('<div class="state-box"><svg viewBox="0 0 24 24" style="fill:var(--red);opacity:.6"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><h3 style="color:var(--red)">Connection Failed</h3><p style="font-size:.83rem;max-width:360px;margin:.5rem auto;line-height:1.6">'+msg+'</p><button onclick="loadData()" style="margin-top:1rem;background:var(--blue-d);border:1px solid var(--blue-b);color:var(--blue2);padding:.5rem 1.25rem;border-radius:9px;cursor:pointer;font-size:.85rem;font-weight:700;font-family:inherit">↻ Retry</button></div>');
}
</script>
</body>
</html>
